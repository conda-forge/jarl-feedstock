context:
  version: "0.6.0"

package:
  name: jarl
  version: ${{ version }}

source:
  url: https://github.com/etiennebacher/jarl/archive/refs/tags/${{ version }}.tar.gz
  sha256: 86620fcdb654d18be5f9fc62257ff577eade56cb1a6d9a3bc7d6e6857006a8a7

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - cd crates/jarl
      - if: unix
        then:
          - cargo auditable install --path=. --root="$PREFIX" --no-track --locked --bins
          # generate shell completions
          - if: build_platform == host_platform
            then:
              - mkdir -p "$PREFIX"/share/bash-completion/completions "$PREFIX"/share/fish/vendor_completions.d "$PREFIX"/share/zsh/site-functions
              - COMPLETE=bash jarl > "$PREFIX"/share/bash-completion/completions/jarl
              - COMPLETE=fish jarl > "$PREFIX"/share/fish/vendor_completions.d/jarl.fish
              - COMPLETE=zsh  jarl > "$PREFIX"/share/zsh/site-functions/_jarl
      - if: win
        then:
          # work around Windows `MAX_PATH` (260 char) limitation
          - set "CARGO_HOME=C:\.cargo"
          - cargo auditable install --path=. --root="%LIBRARY_PREFIX%" --no-track --locked --bins
          # generate shell completions
          - if: build_platform == host_platform
            then:
              - if not exist "%LIBRARY_PREFIX%"\share\bash-completion\completions mkdir "%LIBRARY_PREFIX%"\share\bash-completion\completions
              - if not exist "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d   mkdir "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d
              - if not exist "%LIBRARY_PREFIX%"\share\zsh\site-functions          mkdir "%LIBRARY_PREFIX%"\share\zsh\site-functions
              - cmd /c "set "COMPLETE=bash" && "%LIBRARY_BIN%"\jarl.exe > "%LIBRARY_PREFIX%"\share\bash-completion\completions\jarl"
              - cmd /c "set "COMPLETE=fish" && "%LIBRARY_BIN%"\jarl.exe > "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d\jarl.fish"
              - cmd /c "set "COMPLETE=zsh"  && "%LIBRARY_BIN%"\jarl.exe > "%LIBRARY_PREFIX%"\share\zsh\site-functions\_jarl"
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses

tests:
  - script:
      - jarl --help
      - jarl --version
  - package_contents:
      bin:
        - jarl
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/jarl
            - share/fish/vendor_completions.d/jarl.fish
            - share/zsh/site-functions/_jarl
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/jarl
            - Library/share/fish/vendor_completions.d/jarl.fish
            - Library/share/zsh/site-functions/_jarl
      strict: true

about:
  summary: Just Another R Linter
  description: |
    Jarl is a fast linter for R: it does static code analysis to search for
    programming errors, bugs, and suspicious patterns of code. It supports
    automatic fixes, 55+ rules, multiple output formats, and integration in
    popular IDEs and editors as well as CI workflows.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://jarl.etiennebacher.com/
  repository: https://github.com/etiennebacher/jarl/

extra:
  recipe-maintainers:
    - etiennebacher
    - salim-b
